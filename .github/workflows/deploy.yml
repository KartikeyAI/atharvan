name: Deploy

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: atharvan_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atharvan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check migration history
        run: pnpm migration:check

      - name: Migrate a clean PostgreSQL database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atharvan_ci

      - name: Verify migrated contracts
        run: pnpm migration:verify
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atharvan_ci

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          ATHARVAN_RUN_DB_INTEGRATION_TESTS: "1"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atharvan_ci

      - name: Build
        run: pnpm build

  deploy-development:
    if: github.ref == 'refs/heads/dev'
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply development database migrations
        run: pnpm db:migrate

      - name: Deploy development console
        run: pnpm --filter @atharvan/console deploy:dev

      - name: Deploy development control-plane worker
        run: pnpm --filter @atharvan/worker deploy:dev

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production database migrations
        run: pnpm db:migrate

      - name: Deploy production console
        run: pnpm --filter @atharvan/console deploy:production

      - name: Deploy production control-plane worker
        run: pnpm --filter @atharvan/worker deploy:production
