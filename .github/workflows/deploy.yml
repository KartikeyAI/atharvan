name: Deploy

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: atharvan_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atharvan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check migration history
        run: pnpm migration:check

      - name: Migrate a clean PostgreSQL database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atharvan_ci

      - name: Verify migrated contracts
        run: pnpm migration:verify
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atharvan_ci

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Required database integration contracts
        run: pnpm test:integration
        env:
          ATHARVAN_TEST_DATABASE_DISPOSABLE: "1"
          ATHARVAN_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atharvan_ci

      - name: Build
        run: pnpm build

  deploy-development:
    if: github.ref == 'refs/heads/dev'
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      ATHARVAN_VERIFICATION_HMAC_SECRET: ${{ secrets.ATHARVAN_VERIFICATION_HMAC_SECRET }}
      ATHARVAN_EMAIL_RECIPIENT_HMAC_SECRET: ${{ secrets.ATHARVAN_EMAIL_RECIPIENT_HMAC_SECRET }}
      ATHARVAN_SUPER_ADMIN_EMAIL: ${{ secrets.ATHARVAN_SUPER_ADMIN_EMAIL }}
      ATHARVAN_EMAIL_FROM: Atharvan <login@updates.arth.sh>
      ATHARVAN_ALERT_EMAIL_TO: ${{ vars.ATHARVAN_ALERT_EMAIL_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      CLOUDFLARE_SECRETS_STORE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_SECRETS_STORE_ACCOUNT_ID }}
      CLOUDFLARE_SECRETS_STORE_ID: ${{ secrets.CLOUDFLARE_SECRETS_STORE_ID }}
      CLOUDFLARE_SECRETS_STORE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECRETS_STORE_API_TOKEN }}
      ATHARVAN_ARTH_CURRENT_KEY_ID: ${{ secrets.ATHARVAN_ARTH_CURRENT_KEY_ID }}
      ATHARVAN_ARTH_CURRENT_SHARED_SECRET: ${{ secrets.ATHARVAN_ARTH_CURRENT_SHARED_SECRET }}
      ATHARVAN_ARTH_PREVIOUS_KEY_ID: ${{ secrets.ATHARVAN_ARTH_PREVIOUS_KEY_ID }}
      ATHARVAN_ARTH_PREVIOUS_SHARED_SECRET: ${{ secrets.ATHARVAN_ARTH_PREVIOUS_SHARED_SECRET }}
      ATHARVAN_ARTH_AUDIENCE: ${{ vars.ATHARVAN_ARTH_AUDIENCE }}
      ATHARVAN_CONTROL_PLANE_ORIGIN: ${{ vars.ATHARVAN_CONTROL_PLANE_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply development database migrations
        run: pnpm db:migrate

      - name: Synchronize development Worker runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          required_secrets=(
            DATABASE_URL
            BETTER_AUTH_SECRET
            ATHARVAN_VERIFICATION_HMAC_SECRET
            ATHARVAN_SUPER_ADMIN_EMAIL
            ATHARVAN_EMAIL_FROM
            RESEND_API_KEY
            RESEND_WEBHOOK_SECRET
          )
          optional_secrets=(
            STRIPE_SECRET_KEY
            ATHARVAN_EMAIL_RECIPIENT_HMAC_SECRET
            ATHARVAN_ALERT_EMAIL_TO
            CLOUDFLARE_SECRETS_STORE_ACCOUNT_ID
            CLOUDFLARE_SECRETS_STORE_ID
            CLOUDFLARE_SECRETS_STORE_API_TOKEN
            ATHARVAN_ARTH_CURRENT_KEY_ID
            ATHARVAN_ARTH_CURRENT_SHARED_SECRET
            ATHARVAN_ARTH_PREVIOUS_KEY_ID
            ATHARVAN_ARTH_PREVIOUS_SHARED_SECRET
            ATHARVAN_ARTH_AUDIENCE
          )
          secret_store_values=0
          for secret_name in \
            CLOUDFLARE_SECRETS_STORE_ACCOUNT_ID \
            CLOUDFLARE_SECRETS_STORE_ID \
            CLOUDFLARE_SECRETS_STORE_API_TOKEN; do
            if [[ -n "${!secret_name:-}" ]]; then
              secret_store_values=$((secret_store_values + 1))
            fi
          done
          if [[ "$secret_store_values" -ne 0 && "$secret_store_values" -ne 3 ]]; then
            echo "::error::Cloudflare Secrets Store configuration must contain all three values."
            exit 1
          fi
          arth_current_values=0
          for secret_name in ATHARVAN_ARTH_CURRENT_KEY_ID ATHARVAN_ARTH_CURRENT_SHARED_SECRET ATHARVAN_ARTH_AUDIENCE; do
            [[ -z "${!secret_name:-}" ]] || arth_current_values=$((arth_current_values + 1))
          done
          if [[ "$arth_current_values" -ne 0 && "$arth_current_values" -ne 3 ]]; then
            echo "::error::Current Arth workload configuration must contain all three values."
            exit 1
          fi
          arth_previous_values=0
          for secret_name in ATHARVAN_ARTH_PREVIOUS_KEY_ID ATHARVAN_ARTH_PREVIOUS_SHARED_SECRET; do
            [[ -z "${!secret_name:-}" ]] || arth_previous_values=$((arth_previous_values + 1))
          done
          if [[ "$arth_previous_values" -ne 0 && "$arth_previous_values" -ne 2 ]]; then
            echo "::error::Previous Arth workload configuration must contain both values."
            exit 1
          fi
          for secret_name in "${required_secrets[@]}"; do
            secret_value="${!secret_name:-}"
            if [[ -z "$secret_value" ]]; then
              echo "::error::$secret_name is required in the development environment."
              exit 1
            fi
            printf '%s' "$secret_value" | pnpm --filter @atharvan/worker exec wrangler secret put "$secret_name" --env dev
          done
          for secret_name in "${optional_secrets[@]}"; do
            secret_value="${!secret_name:-}"
            if [[ -n "$secret_value" ]]; then
              printf '%s' "$secret_value" | pnpm --filter @atharvan/worker exec wrangler secret put "$secret_name" --env dev
            fi
          done

      - name: Deploy development control-plane worker
        run: pnpm --filter @atharvan/worker deploy:dev

      - name: Verify development control-plane readiness
        run: node scripts/verify-deployed-readiness.mjs "$ATHARVAN_CONTROL_PLANE_ORIGIN" development 31

      - name: Deploy development console
        run: pnpm --filter @atharvan/console deploy:dev

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      ATHARVAN_VERIFICATION_HMAC_SECRET: ${{ secrets.ATHARVAN_VERIFICATION_HMAC_SECRET }}
      ATHARVAN_EMAIL_RECIPIENT_HMAC_SECRET: ${{ secrets.ATHARVAN_EMAIL_RECIPIENT_HMAC_SECRET }}
      ATHARVAN_SUPER_ADMIN_EMAIL: ${{ secrets.ATHARVAN_SUPER_ADMIN_EMAIL }}
      ATHARVAN_EMAIL_FROM: Atharvan <login@updates.arth.sh>
      ATHARVAN_PUBLIC_ORIGIN: ${{ vars.ATHARVAN_PUBLIC_ORIGIN }}
      ATHARVAN_ALERT_EMAIL_TO: ${{ vars.ATHARVAN_ALERT_EMAIL_TO }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      CLOUDFLARE_SECRETS_STORE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_SECRETS_STORE_ACCOUNT_ID }}
      CLOUDFLARE_SECRETS_STORE_ID: ${{ secrets.CLOUDFLARE_SECRETS_STORE_ID }}
      CLOUDFLARE_SECRETS_STORE_API_TOKEN: ${{ secrets.CLOUDFLARE_SECRETS_STORE_API_TOKEN }}
      ATHARVAN_ARTH_CURRENT_KEY_ID: ${{ secrets.ATHARVAN_ARTH_CURRENT_KEY_ID }}
      ATHARVAN_ARTH_CURRENT_SHARED_SECRET: ${{ secrets.ATHARVAN_ARTH_CURRENT_SHARED_SECRET }}
      ATHARVAN_ARTH_PREVIOUS_KEY_ID: ${{ secrets.ATHARVAN_ARTH_PREVIOUS_KEY_ID }}
      ATHARVAN_ARTH_PREVIOUS_SHARED_SECRET: ${{ secrets.ATHARVAN_ARTH_PREVIOUS_SHARED_SECRET }}
      ATHARVAN_ARTH_AUDIENCE: ${{ vars.ATHARVAN_ARTH_AUDIENCE }}
      ATHARVAN_CONTROL_PLANE_ORIGIN: ${{ vars.ATHARVAN_CONTROL_PLANE_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply production database migrations
        run: pnpm db:migrate

      - name: Synchronize production Worker runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          required_secrets=(
            DATABASE_URL
            BETTER_AUTH_SECRET
            ATHARVAN_VERIFICATION_HMAC_SECRET
            ATHARVAN_EMAIL_RECIPIENT_HMAC_SECRET
            ATHARVAN_SUPER_ADMIN_EMAIL
            ATHARVAN_EMAIL_FROM
            ATHARVAN_PUBLIC_ORIGIN
            ATHARVAN_ALERT_EMAIL_TO
            RESEND_API_KEY
            RESEND_WEBHOOK_SECRET
            STRIPE_SECRET_KEY
            CLOUDFLARE_SECRETS_STORE_ACCOUNT_ID
            CLOUDFLARE_SECRETS_STORE_ID
            CLOUDFLARE_SECRETS_STORE_API_TOKEN
            ATHARVAN_ARTH_CURRENT_KEY_ID
            ATHARVAN_ARTH_CURRENT_SHARED_SECRET
            ATHARVAN_ARTH_AUDIENCE
          )
          optional_secrets=(
            ATHARVAN_ARTH_PREVIOUS_KEY_ID
            ATHARVAN_ARTH_PREVIOUS_SHARED_SECRET
          )
          secret_store_values=0
          for secret_name in \
            CLOUDFLARE_SECRETS_STORE_ACCOUNT_ID \
            CLOUDFLARE_SECRETS_STORE_ID \
            CLOUDFLARE_SECRETS_STORE_API_TOKEN; do
            if [[ -n "${!secret_name:-}" ]]; then
              secret_store_values=$((secret_store_values + 1))
            fi
          done
          if [[ "$secret_store_values" -ne 0 && "$secret_store_values" -ne 3 ]]; then
            echo "::error::Cloudflare Secrets Store configuration must contain all three values."
            exit 1
          fi
          arth_previous_values=0
          for secret_name in ATHARVAN_ARTH_PREVIOUS_KEY_ID ATHARVAN_ARTH_PREVIOUS_SHARED_SECRET; do
            [[ -z "${!secret_name:-}" ]] || arth_previous_values=$((arth_previous_values + 1))
          done
          if [[ "$arth_previous_values" -ne 0 && "$arth_previous_values" -ne 2 ]]; then
            echo "::error::Previous Arth workload configuration must contain both values."
            exit 1
          fi
          for secret_name in "${required_secrets[@]}"; do
            secret_value="${!secret_name:-}"
            if [[ -z "$secret_value" ]]; then
              echo "::error::$secret_name is required in the production environment."
              exit 1
            fi
            printf '%s' "$secret_value" | pnpm --filter @atharvan/worker exec wrangler secret put "$secret_name" --env production
          done
          for secret_name in "${optional_secrets[@]}"; do
            secret_value="${!secret_name:-}"
            if [[ -n "$secret_value" ]]; then
              printf '%s' "$secret_value" | pnpm --filter @atharvan/worker exec wrangler secret put "$secret_name" --env production
            fi
          done

      - name: Deploy production control-plane worker
        run: pnpm --filter @atharvan/worker deploy:production

      - name: Verify production control-plane readiness
        run: node scripts/verify-deployed-readiness.mjs "$ATHARVAN_CONTROL_PLANE_ORIGIN" production 31

      - name: Deploy production console
        run: pnpm --filter @atharvan/console deploy:production
